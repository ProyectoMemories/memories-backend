# Configuración de Alembic. La URL de la base NO va aquí: se lee de la variable
# de entorno DATABASE_URL (alembic/env.py), igual que en la API.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# Nombres de archivo con el número de revisión primero: 0001_..., 0002_...
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
