name: CI

on:
  pull_request:
  push:
    branches: [main]

# El CI solo lee el código; no necesita más permisos.
permissions:
  contents: read

# Si subes otro commit al mismo PR, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar herramientas
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Formato
        run: ruff format --check .

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PostgreSQL 18 real para las migraciones y las pruebas de la base (D41).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: memories
          POSTGRES_PASSWORD: memories
          POSTGRES_DB: memories
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memories"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://memories:memories@localhost:5432/memories
      TEST_DATABASE_URL: postgresql+psycopg://memories:memories@localhost:5432/memories_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar herramientas
        run: pip install -r requirements-dev.txt
      - name: "Migraciones: upgrade → downgrade → upgrade"
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current | grep -q "(head)"
      - name: Pruebas
        run: pytest

  docker-compose:
    name: docker-compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Preparar .env de ejemplo
        run: cp .env.example .env
      - name: Validar el archivo
        run: docker compose config --quiet
      - name: Levantar los servicios y esperar sus healthchecks
        run: docker compose up -d --wait --wait-timeout 180 db minio mailpit
      - name: Crear el bucket (dos veces, para probar que es idempotente)
        run: |
          docker compose run --rm minio-init
          docker compose run --rm minio-init
      - name: Comprobar PostgreSQL 18
        run: |
          docker compose exec -T db psql -U memories -d memories -tAc "show server_version" | tee version.txt
          grep -q '^18\.' version.txt
      - name: Comprobar que el bucket existe
        run: docker compose exec -T minio mcli ls local/memories-photos
      - name: Comprobar Mailpit
        run: curl -fsS http://127.0.0.1:8025/api/v1/info
      - name: Construir y levantar la API
        # --no-deps: sus dependencias ya están arriba y el bucket ya existe.
        run: docker compose up -d --build --wait --wait-timeout 180 --no-deps api
      - name: Comprobar /health de la API
        run: |
          curl -fsS http://127.0.0.1:8001/health | tee health.json
          grep -q '"status":"ok"' health.json
      - name: Aplicar las migraciones desde la imagen de la API
        run: |
          docker compose exec -T api alembic upgrade head
          docker compose exec -T db psql -U memories -d memories -tAc \
            "select count(*) from pg_tables where schemaname = 'public'" | tee tables.txt
          # 16 tablas del modelo v1.5 + alembic_version
          grep -qx 17 tables.txt
      - name: "Registro de punta a punta: API → Mailpit → verificación"
        run: |
          curl -fsS -X POST http://127.0.0.1:8001/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username": "ci.prueba", "email": "ci@correo.com",
                 "password": "caballo bateria grapa", "first_name": "CI",
                 "paternal_surname": "Prueba", "birth_date": "2000-01-01",
                 "accepts_privacy_policy": true}'
          # El correo llega a Mailpit; se saca el token del enlace.
          curl -fsS http://127.0.0.1:8025/api/v1/message/latest > email.json
          token=$(grep -oE 'token=[A-Za-z0-9._-]+' email.json | head -1 | cut -d= -f2)
          test -n "$token"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            http://127.0.0.1:8001/api/v1/auth/verify-email \
            -H "Content-Type: application/json" -d "{\"token\": \"$token\"}")
          test "$code" = 204
          docker compose exec -T db psql -U memories -d memories -tAc \
            "select status from app_user where username = 'ci.prueba'" | tee status.txt
          grep -qx active status.txt
      - name: Logs si algo falló
        if: failure()
        run: docker compose logs
      - name: Apagar
        if: always()
        run: docker compose down -v
