# ════════════════════════════════════════════════════════════════════
# Memories — entorno local completo (RNF-06)
#   docker compose up -d              → db + redis + minio + api
#   docker compose --profile tools up  → ademas Adminer (UI de la BD)
# Requiere un .env en esta carpeta (copialo de .env.example).
# ════════════════════════════════════════════════════════════════════

x-api-env: &api-env
  ENV: ${ENV:-development}
  DEBUG: ${DEBUG:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-console}
  DOCS_LOCAL_ONLY: ${DOCS_LOCAL_ONLY:-true}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8080}
  # Dentro de la red de Compose los servicios se llaman por su nombre.
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-memories}:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}@db:5432/${POSTGRES_DB:-memories}
  REDIS_URL: redis://:${REDIS_PASSWORD:?falta REDIS_PASSWORD en .env}@redis:6379/0
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?falta JWT_SECRET_KEY en .env}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
  PASSWORD_HASHING_SCHEME: ${PASSWORD_HASHING_SCHEME:-bcrypt}
  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
  RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
  RATE_LIMIT_DEFAULT_PER_MINUTE: ${RATE_LIMIT_DEFAULT_PER_MINUTE:-120}
  CACHE_PROVIDER: redis
  # Almacenamiento: MinIO en local, S3 en el despliegue (RNF-09).
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
  S3_BUCKET: ${S3_BUCKET:-memories-photos}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?falta MINIO_ROOT_USER en .env}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?falta MINIO_ROOT_PASSWORD en .env}
  S3_USE_SSL: "false"
  # La API habla con MinIO por la red interna...
  S3_ENDPOINT_URL: http://minio:9000
  # ...pero las URLs firmadas las consume el telefono o el navegador, que ven
  # MinIO publicado en el host. Por eso el endpoint publico es distinto.
  # Emulador Android: cambia localhost por 10.0.2.2.
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9010}
  S3_PRESIGNED_URL_TTL_SECONDS: ${S3_PRESIGNED_URL_TTL_SECONDS:-900}
  MAX_PHOTOS_PER_MEMORY: ${MAX_PHOTOS_PER_MEMORY:-10}
  MAX_PHOTO_SIZE_MB: ${MAX_PHOTO_SIZE_MB:-15}
  ALLOWED_IMAGE_CONTENT_TYPES: ${ALLOWED_IMAGE_CONTENT_TYPES:-image/jpeg,image/png,image/webp}

services:

  # ─── PostgreSQL (RNF-03) ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: memories_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memories}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-memories}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memories} -d ${POSTGRES_DB:-memories}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [memories_net]

  # ─── Redis: sesiones (refresh tokens) y rate limiting ────────────
  redis:
    image: redis:7-alpine
    container_name: memories_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?falta REDIS_PASSWORD en .env}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?falta REDIS_PASSWORD en .env}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [memories_net]

  # ─── MinIO: almacenamiento de fotografias compatible con S3 ──────
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: memories_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?falta MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?falta MINIO_ROOT_PASSWORD en .env}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_PORT:-9011}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [memories_net]

  # Crea el bucket la primera vez y termina.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: memories_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${S3_BUCKET:-memories-photos} &&
      mc anonymous set private local/${S3_BUCKET:-memories-photos} &&
      echo 'bucket listo'
      "
    networks: [memories_net]

  # ─── API (RNF-01) ────────────────────────────────────────────────
  api:
    build:
      context: .
      target: ${API_BUILD_TARGET:-development}
    container_name: memories_api
    restart: unless-stopped
    environment: *api-env
    volumes:
      # Recarga en caliente: el codigo del host manda en desarrollo.
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./tests:/app/tests
    ports:
      - "${API_HOST_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [memories_net]

  # ─── Adminer: UI de la base de datos (opcional) ──────────────────
  adminer:
    image: adminer:latest
    container_name: memories_adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_HOST_PORT:-8081}:8080"
    depends_on: [db]
    networks: [memories_net]
    profiles: [tools]

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  memories_net:
    driver: bridge
