# Configuración de las herramientas de calidad. Las dependencias están en
# requirements.txt (API) y requirements-dev.txt (desarrollo y CI).

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# E/F: errores básicos · I: orden de imports · B: errores comunes
# UP: sintaxis moderna de Python · S: problemas de seguridad · SIM: simplificaciones
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# En las pruebas, assert es la forma normal de comprobar y las claves son falsas.
"tests/**" = ["S101", "S105", "S106", "S107"]
# La migración 0001 copia el SQL del modelo físico tal cual, con sus líneas largas.
"alembic/versions/0001_initial_schema.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
# La carpeta alembic/ del repo no es el paquete alembic.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Las advertencias de las librerías se ven como errores para enterarnos a tiempo.
filterwarnings = ["error"]

# Regla de dependencias de Clean Architecture (CLAUDE.md §7): cada círculo
# solo importa a los de adentro. `lint-imports` falla si alguien la rompe.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "auth: frameworks → adapters → use_cases → entities"
type = "layers"
layers = [
    "app.modules.auth.frameworks",
    "app.modules.auth.adapters",
    "app.modules.auth.use_cases",
    "app.modules.auth.entities",
]

[[tool.importlinter.contracts]]
name = "users: frameworks → adapters → use_cases → entities"
type = "layers"
layers = [
    "app.modules.users.frameworks",
    "app.modules.users.adapters",
    "app.modules.users.use_cases",
    "app.modules.users.entities",
]

[[tool.importlinter.contracts]]
name = "shared: frameworks → adapters → use_cases → entities"
type = "layers"
layers = [
    "app.shared.frameworks",
    "app.shared.adapters",
    "app.shared.use_cases",
    "app.shared.entities",
]

[[tool.importlinter.contracts]]
name = "Las entidades son Python puro"
type = "forbidden"
source_modules = [
    "app.modules.auth.entities", "app.modules.users.entities", "app.shared.entities",
]
forbidden_modules = [
    "fastapi", "starlette", "pydantic", "pydantic_settings", "sqlalchemy",
    "psycopg", "jwt", "pwdlib",
    "app.modules.auth.use_cases", "app.modules.auth.adapters",
    "app.modules.auth.frameworks",
    "app.modules.users.use_cases", "app.modules.users.adapters",
    "app.modules.users.frameworks",
    "app.shared.use_cases", "app.shared.adapters", "app.shared.frameworks",
]

[[tool.importlinter.contracts]]
name = "Los casos de uso no saben de HTTP, SQL ni librerías externas"
type = "forbidden"
source_modules = [
    "app.modules.auth.use_cases", "app.modules.users.use_cases",
    "app.shared.use_cases",
]
forbidden_modules = [
    "fastapi", "starlette", "pydantic", "pydantic_settings", "sqlalchemy",
    "psycopg", "jwt", "pwdlib",
    "app.modules.auth.adapters", "app.modules.auth.frameworks",
    "app.modules.users.adapters", "app.modules.users.frameworks",
    "app.shared.adapters", "app.shared.frameworks",
]

[[tool.importlinter.contracts]]
name = "Los adaptadores no dependen de frameworks/"
type = "forbidden"
source_modules = [
    "app.modules.auth.adapters", "app.modules.users.adapters", "app.shared.adapters",
]
forbidden_modules = [
    "app.modules.auth.frameworks", "app.modules.users.frameworks",
    "app.shared.frameworks", "app.main",
]

[[tool.importlinter.contracts]]
name = "shared/ no depende de ningún módulo"
type = "forbidden"
source_modules = ["app.shared"]
forbidden_modules = ["app.modules"]

# Entre módulos (CLAUDE.md §7, D81): users solo usa de auth la dependencia
# CurrentUser, y solo desde su router. Todo lo demás de auth está prohibido,
# también lo que se agregue después. Que CurrentUser, por dentro, use los
# interactores de auth es asunto de auth: por eso se permiten los imports
# indirectos. Qué se importa de dependencies.py se revisa en el PR.
[[tool.importlinter.contracts]]
name = "users solo usa CurrentUser de auth"
type = "forbidden"
source_modules = ["app.modules.users"]
forbidden_modules = ["app.modules.auth"]
ignore_imports = [
    "app.modules.users.adapters.controllers.router -> app.modules.auth.adapters.controllers.dependencies",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Las reglas de users no conocen auth"
type = "forbidden"
source_modules = ["app.modules.users.entities", "app.modules.users.use_cases"]
forbidden_modules = ["app.modules.auth"]

[[tool.importlinter.contracts]]
name = "auth no depende de users"
type = "forbidden"
source_modules = ["app.modules.auth"]
forbidden_modules = ["app.modules.users"]

# Verificación de tipos: entre otras cosas, comprueba que cada adaptador y cada
# doble de prueba cumpla su puerto (typing.Protocol), CLAUDE.md §7.
[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
