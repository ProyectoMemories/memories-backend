# Configuración de las herramientas de calidad. Las dependencias están en
# requirements.txt (API) y requirements-dev.txt (desarrollo y CI).

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# E/F: errores básicos · I: orden de imports · B: errores comunes
# UP: sintaxis moderna de Python · S: problemas de seguridad · SIM: simplificaciones
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# En las pruebas, assert es la forma normal de comprobar.
"tests/**" = ["S101"]
# La migración 0001 copia el SQL del modelo físico tal cual, con sus líneas largas.
"alembic/versions/0001_initial_schema.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
# La carpeta alembic/ del repo no es el paquete alembic.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Las advertencias de las librerías se ven como errores para enterarnos a tiempo.
filterwarnings = ["error"]
